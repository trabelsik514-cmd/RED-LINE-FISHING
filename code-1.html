<div id="map" style="width:100%;height:500px;border-radius:10px;"></div>

<div style="background:#263238;color:#fff;padding:10px;margin-top:5px;
     display:flex;justify-content:space-around;border-radius:10px;
     font-family:sans-serif;text-align:center;">
  <div>⚡<br><b id="speed">0.0</b> كم/س</div>
  <div>📏<br><b id="distance">--</b></div>
  <div>⏱️<br><b id="time">--:--</b></div>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
(function(){
  var map = L.map('map').setView([36.8700, 10.3480], 14);

  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Esri'
  }).addTo(map);

  L.tileLayer('https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png').addTo(map);

  var userMarker = null, destMarker = null, routeLine = null;
  var destination = null, userPos = null, lastSpeed = 0;

  function haversine(lat1, lon1, lat2, lon2) {
    var R = 6371000, rad = function(d){ return d * Math.PI / 180; };
    var dLat = rad(lat2-lat1), dLon = rad(lon2-lon1);
    var a = Math.sin(dLat/2)*Math.sin(dLat/2) +
            Math.cos(rad(lat1))*Math.cos(rad(lat2))*Math.sin(dLon/2)*Math.sin(dLon/2);
    return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  function updateRoute() {
    if (!userPos || !destination) return;

    var pts = [userPos, destination];
    if (routeLine) routeLine.setLatLngs(pts);
    else routeLine = L.polyline(pts, {color:'blue', weight:4}).addTo(map);

    var d = haversine(userPos.lat, userPos.lng, destination.lat, destination.lng);
    document.getElementById('distance').textContent =
      d >= 1000 ? (d/1000).toFixed(2)+' كم' : d.toFixed(0)+' م';

    if (lastSpeed > 0.5) {
      var mins = Math.round(d/lastSpeed/60);
      document.getElementById('time').textContent =
        mins >= 60 ? Math.floor(mins/60)+'س '+(mins%60)+'د' : mins+' د';
    } else {
      document.getElementById('time').textContent = '--:--';
    }
  }

  map.on('click', function(e){
    destination = e.latlng;
    if (destMarker) destMarker.setLatLng(e.latlng);
    else destMarker = L.marker(e.latlng).addTo(map);
    updateRoute();
  });

  if (navigator.geolocation) {
    navigator.geolocation.watchPosition(function(pos){
      userPos = L.latLng(pos.coords.latitude, pos.coords.longitude);
      lastSpeed = pos.coords.speed || 0;

      var icon = L.divIcon({
        html: '<div style="font-size:32px;">📍</div>',
        iconSize: [32,32], iconAnchor: [16,16], className: ''
      });

      if (userMarker) userMarker.setLatLng(userPos);
      else userMarker = L.marker(userPos, {icon: icon}).addTo(map);

      document.getElementById('speed').textContent = (lastSpeed*3.6).toFixed(1);
      updateRoute();
      map.setView(userPos, Math.max(map.getZoom(), 14));
    }, function(err){
      console.log('GPS: ' + err.message);
    }, { enableHighAccuracy: true, maximumAge: 5000 });
  }
})();
</script>
